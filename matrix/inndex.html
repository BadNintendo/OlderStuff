<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expanded Matrix Code Effect</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      color: limegreen;
      font-family: 'Courier New', Courier, monospace;
    }

    .matrix {
      position: absolute;
      white-space: nowrap;
      font-size: 16px;
      opacity: 0.8;
      cursor: pointer;
    }

    .expand {
      position: absolute;
      color: white;
      opacity: 0.3;
      animation: expand 2.5s ease-out forwards;
    }

    @keyframes expand {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }
      100% {
        transform: scale(100); /* Expand massively */
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <script>
    const columns = Math.floor(window.innerWidth / 16);
    const rows = Math.floor(window.innerHeight / 16);
    const matrixElements = [];
    const speed = 100; // Speed of falling digits

    // Create matrix effect to fill entire screen
    function createMatrixEffect() {
      for (let x = 0; x < columns; x++) {
        for (let y = 0; y < rows; y++) {
          const span = document.createElement('span');
          span.classList.add('matrix');
          span.style.left = `${x * 16}px`;
          span.style.top = `${y * 16}px`;
          span.textContent = randomBinary();
          span.dataset.x = x;
          span.dataset.y = y;
          span.addEventListener('click', handleDigitClick); // Add click event
          document.body.appendChild(span);
          matrixElements.push(span);
        }
      }
    }

    // Generate random binary (0 or 1)
    function randomBinary() {
      return Math.random() > 0.5 ? '1' : '0';
    }

    // Update matrix effect (falling digits)
    function updateMatrixEffect() {
      matrixElements.forEach((element) => {
        const randomChar = randomBinary();
        element.textContent = randomChar;
      });
    }

    // Handle digit click to trigger the expansion effect
    function handleDigitClick(event) {
      const element = event.target;

      // Only expand the clicked element if it's a '0'
      if (element.textContent === '0') {
        const clone = element.cloneNode(true);
        clone.classList.add('expand');
        clone.style.left = element.style.left;
        clone.style.top = element.style.top;
        clone.style.fontSize = element.style.fontSize; // Start at the current size
        document.body.appendChild(clone);

        // Remove the clone after the animation ends
        clone.addEventListener('animationend', () => {
          clone.remove();
        });
      }
    }

    // Main animation loop for the falling effect
    function animate() {
      updateMatrixEffect();
      setTimeout(animate, speed);
    }

    // Initialize matrix effect to fill the screen and animate
    createMatrixEffect();
    animate();
  </script>
</body>
</html>
