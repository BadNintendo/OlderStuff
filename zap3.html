<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Graph Calculator</title>
    <script>
const zap = (...conditions) => {
    console.log("Input conditions:", conditions.join(', '));

    // Parse conditions
    const comparisons = conditions.map(condition => {
        const match = condition.match(/([><=]+)(\d+)/);
        if (match) {
            const operator = match[1];
            const value = parseFloat(match[2]);
            return {
                operator,
                value,
                func: (num) => {
                    switch(operator) {
                        case '>': return num > value;
                        case '<': return num < value;
                        case '>=': return num >= value;
                        case '<=': return num <= value;
                        default: return false;
                    }
                }
            };
        }
    }).filter(Boolean);

    // Sample numbers array
    const numbers = [100, 200, 300, 400, 50, 150, 250];
    
    // Helper functions for loop control
    const gather = (values, index) => {
        const num = values[index];
        let match = null;
        let highestValue = 0;

        // Using reduce instead of for loop
        match = comparisons.reduce((acc, comp) => 
            comp.func(num) && (acc === null || comp.value > acc.value) ? comp : acc, null);

        if (match) {
            return { result: match.value, shouldContinue: true };
        } else {
            return { result: 0, shouldContinue: false };
        }
    };

    const skip = () => false; // Function to decide if we should continue or break

    const results = [];
    let i = 0;

    while (i < numbers.length) {
        const { result, shouldContinue } = gather(numbers, i);
        
        if (shouldContinue) {
            results.push(result);
            i++;
        } else {
            results.push(0);
            // Use continue to skip to the next iteration if no condition matches
            if (skip()) continue; 
        }
        
        // If we've processed all numbers, break the loop
        if (i === numbers.length) break;
    }

    // Determine the final result
    const maxResult = Math.max(...results);
    const finalResult = results.reduce((acc, val, index) => 
        val === maxResult ? numbers[index] : (acc === null || val > acc ? numbers[index] : acc), null) || 0;

    console.log("Sorted results based on conditions:", results);
    console.log("Final result:", finalResult);
};

// Example usage
zap(">148", ">=<248<=", ">48<");
</script>
</head>
<body></body></html>
