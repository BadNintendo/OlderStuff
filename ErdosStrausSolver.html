<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f0f0f0;
        margin: 0;
    }

    .calculator {
        background-color: #fff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 300px;
        text-align: center;
    }

    input, select, button, textarea {
        width: 100%;
        padding: 10px;
        margin: 5px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-sizing: border-box;
    }

    textarea {
        height: 100px;
    }

    button {
        background-color: #007bff;
        color: white;
        border: none;
    }

    button:hover {
        background-color: #0056b3;
    }
    </style>
</head>
<body>
    <div class="calculator">
        <input type="number" id="inputA" placeholder="Enter a value for A">
        <input type="number" id="inputB" placeholder="Enter a value for B">
        <select id="operation">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="+ | +">+ | +</option>
            <option value="- | -">- | -</option>
        </select>
        <input type="number" id="inputC" placeholder="Enter a value for C" style="display: none;">
        <button id="addC">+ Add C</button>
        <button id="calculate">Calculate</button>
        <textarea id="results" placeholder="Results will appear here..." readonly></textarea>
        <input type="text" id="search" placeholder="Search...">
    </div>
    <script>
        document.getElementById('addC').addEventListener('click', function() {
		    document.getElementById('inputC').style.display = 'block';
		    this.style.display = 'none';
		});

		document.getElementById('calculate').addEventListener('click', function() {
		    const a = parseInt(document.getElementById('inputA').value);
		    const b = parseInt(document.getElementById('inputB').value);
		    const cInput = document.getElementById('inputC').style.display === 'block';
		    const c = cInput ? parseInt(document.getElementById('inputC').value) : 0;
		    const operation = document.getElementById('operation').value;
		    let results = '';

		    if (!isNaN(a) && !isNaN(b) && (!cInput || !isNaN(c))) {
		        if (operation === '+') {
		            results += `${a} + ${b} = ${a + b}\n`;
		            if (cInput) results += `${a} + ${c} = ${a + c}\n`;
		            if (cInput) results += `${b} + ${c} = ${b + c}\n`;
		            if (cInput) results += `${a} + ${b} + ${c} = ${a + b + c}\n`;
		        } else if (operation === '-') {
		            results += `${a} - ${b} = ${a - b}\n`;
		            if (cInput) results += `${a} - ${c} = ${a - c}\n`;
		            if (cInput) results += `${b} - ${c} = ${b - c}\n`;
		            if (cInput) results += `${a} - ${b} - ${c} = ${a - b - c}\n`;
		        } else if (operation === '+ | +') {
		            if (cInput) results += `${a} + ${b} + ${c} = ${a + b + c}\n`;
		        } else if (operation === '- | -') {
		            if (cInput) results += `${a} - ${b} - ${c} = ${a - b - c}\n`;
		        }
		    }

		    document.getElementById('results').value = results;
		});

		document.getElementById('search').addEventListener('input', function() {
		    const searchValue = this.value.trim();
		    const resultsTextarea = document.getElementById('results');
		    const results = resultsTextarea.value.split('\n');
		    resultsTextarea.value = '';

		    results.forEach(result => {
		        if (result.includes(searchValue)) {
		            resultsTextarea.value += result.replace(new RegExp(searchValue, 'g'), match => `**${match}**`) + '\n';
		        } else {
		            resultsTextarea.value += result + '\n';
		        }
		    });
		});
    </script>
</body>
</html>
