<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Graph Calculator</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
        }
        #canvasContainer {
            width: 100%;
            height: 100%;
        }
        canvas {
            width: 100%;
            height: 100%;
            border: 1px solid #000;
        }
        #resultsContainer {
            position: fixed;
            bottom: 10px;
            right: 10px;
            max-width: 300px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border-radius: 10px;
            overflow-y: auto;
            max-height: 50%;
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>
    <div id="canvasContainer">
        <canvas id="canvas"></canvas>
    </div>
    <div id="resultsContainer"></div>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const resultsContainer = document.getElementById('resultsContainer');

        let scale = 1;
        let originX = 0;
        let originY = 0;

        const colors = ['#FF5733', '#FFBD33', '#75FF33', '#33FF57', '#33FFBD', '#3375FF', '#BD33FF', '#FF33A6'];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        canvas.addEventListener('wheel', (event) => {
            event.preventDefault();
            scale += event.deltaY * -0.01;
            scale = Math.min(Math.max(0.5, scale), 10);
            ctx.setTransform(scale, 0, 0, scale, originX, originY);
            draw();
        });

        function drawArrow(x1, y1, x2, y2, color) {
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.stroke();

            const headlen = 10;
            const angle = Math.atan2(y2 - y1, x2 - x1);
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headlen * Math.cos(angle - Math.PI / 6), y2 - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - headlen * Math.cos(angle + Math.PI / 6), y2 - headlen * Math.sin(angle + Math.PI / 6));
            ctx.stroke();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            for (let i = 0; i < 8; i++) {
                const angle = (Math.PI / 4) * i;
                const x = centerX + 200 * Math.cos(angle);
                const y = centerY + 200 * Math.sin(angle);
                drawArrow(centerX, centerY, x, y, colors[i]);
            }
        }

        draw();

        document.getElementById('clearButton').addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        });

        document.getElementById('resultsButton').addEventListener('click', () => {
            resultsContainer.style.display = resultsContainer.style.display === 'none' ? 'block' : 'none';
        });
    </script>
</body>
</html>
