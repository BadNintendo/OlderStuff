<main class="site-content" id="wrapper">
  <div class="widget-area widger-area--before-loop">
    <div class="widget widget-carousel slick-slider slick-initialized slick-dotted">
      <div class="slick-list draggable">
        <div class="slick-track">
          <!-- Player Card 1 -->
          <article class="widget-carousel__item player-card">
       <style>
/* General body settings */
body {
  font-family: Rajdhani, sans-serif;
  font-size: 0.875rem;
  font-weight: 400;
  color: #222430;
}

@media (min-width: 1920px) {
  body {
    font-size: 1.25rem;
  }
}

/* Player cards settings */
.player-card {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background-color: #222430;
  color: #fff;
  padding: 20px;
  margin-right: 20px;
  border-radius: 10px;
  width: 300px;
  height: 400px;
  transition: transform 0.3s ease-in-out;
}

.player-card:hover {
  transform: scale(1.05);
}

.player-thumbnail img {
  width: 100px;
  height: 100px;
  border-radius: 50%;
}

.player-info {
  text-align: center;
}

.player-name {
  font-size: 1.5rem;
  color: #a3ff12;
  margin-top: 10px;
}

.player-role {
  color: #fc0;
  font-size: 1rem;
}

.player-stats {
  font-size: 1rem;
  color: #88df00;
}

/* Carousel settings */
.slick-list {
  overflow-x: auto;
  display: flex;
  padding: 20px 0;
}

.slick-track {
  display: flex;
  transition: all 0.5s ease-in-out;
}

.slick-dots {
  display: none;
}

/* Ensure smooth scrolling for the carousel */
.slick-list {
  scroll-behavior: smooth;
}

.slick-list::-webkit-scrollbar {
  display: none; /* Hide scrollbar */
}

@media (min-width: 992px) {
  .player-card {
    width: 350px;
    height: 450px;
  }
}

@media (min-width: 1920px) {
  .player-card {
    width: 400px;
    height: 500px;
  }
}

</style>     <div class="player-thumbnail">
